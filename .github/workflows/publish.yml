name: Publish examples to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Allow the job to deploy to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# PRs run independently and superseded PR checks can stop. Publishing remains
# serialized across pushes and manual runs; never cancel a deployment in flight.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.19

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: dev/v86/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agent/requirements-build.txt

      - name: Build Linux agent
        run: |
          python -m pip install -r agent/requirements-build.txt
          ZIG="python -m ziglang" sh agent/build.sh

      # Refresh rolling Debian packages on the first build of each UTC ISO week.
      # No restore prefix: all publication assets must match the build inputs.
      - name: Select VM cache generation
        id: vm-generation
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Cache VM publication assets
        id: vm-assets
        uses: actions/cache@v4
        with:
          path: vm-assets
          key: vm-assets-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.vm-generation.outputs.week }}-${{ hashFiles('dev/v86/Dockerfile', 'dev/v86/.dockerignore', 'dev/v86/init', 'dev/v86/boot-init', 'dev/v86/*.sh', 'dev/v86/build-boot-state.mjs', 'dev/v86/package*.json', 'dev/v86/tools/**') }}

      - name: Build v86 runtime, guest and corresponding sources
        if: steps.vm-assets.outputs.cache-hit != 'true'
        run: bash dev/v86/prepare.sh

      - name: Install tools for cached VM assets
        if: steps.vm-assets.outputs.cache-hit == 'true'
        run: bash dev/v86/install-tools.sh

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('dev/v86/package-lock.json') }}

      - name: Prepare browser fixtures
        run: |
          sh dev/core-tests/sync.sh
          quarto render dev/core-tests/slides.qmd
          quarto render dev/core-tests/doc.qmd
          node dev/apps-mkslides.mjs
          dev/v86/out/node_modules/.bin/playwright install --with-deps chromium

      - name: Test real VM and applications
        run: |
          node dev/server.mjs . 8203 nocoi > /tmp/quarto-os-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node --test dev/v86/hash.test.mjs
          node dev/vm-test.mjs --port 8203 --suite all
          node dev/v86/lifecycle.mjs --port 8203
          node dev/v86/startup.mjs --port 8203
          node dev/v86/http-origin.mjs --port 8203
          node dev/apps-e2e.mjs --port 8203 --real

      - name: Render site
        run: quarto render

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
