name: Publish examples to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Allow the job to deploy to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel a deployment that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.19

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Linux agent
        run: |
          python -m pip install ziglang==0.14.1
          ZIG="python -m ziglang" sh agent/build.sh

      - name: Build v86 runtime, guest and corresponding sources
        run: bash dev/v86/prepare.sh

      - name: Prepare browser fixtures
        run: |
          sh dev/core-tests/sync.sh
          quarto render dev/core-tests/slides.qmd
          quarto render dev/core-tests/doc.qmd
          node dev/apps-mkslides.mjs
          dev/v86/out/node_modules/.bin/playwright install --with-deps chromium

      - name: Test real VM and applications
        run: |
          node dev/server.mjs . 8203 nocoi > /tmp/quarto-os-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node --test dev/v86/hash.test.mjs
          node dev/vm-test.mjs --port 8203 --suite all
          node dev/v86/lifecycle.mjs --port 8203
          node dev/v86/startup.mjs --port 8203
          node dev/v86/http-origin.mjs --port 8203
          node dev/apps-e2e.mjs --port 8203 --real

      - name: Render site
        run: quarto render

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
