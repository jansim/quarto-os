name: Publish examples to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Allow the job to deploy to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# PRs run independently and superseded PR checks can stop. Publishing remains
# serialized across pushes and manual runs; never cancel a deployment in flight.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.19

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: dev/vm/package-lock.json

      - name: Install VM build and test tools
        run: npm ci --prefix dev/vm

      # Rebuild weekly to pick up Alpine package updates. No restore prefix: the
      # published assets must match the build inputs.
      - name: Select VM cache generation
        id: vm-generation
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Cache VM assets
        id: vm-assets
        uses: actions/cache@v4
        with:
          path: vm-assets
          key: vm-assets-v3-python3-${{ steps.vm-generation.outputs.week }}-${{ hashFiles('dev/vm/build.mjs', 'dev/vm/package-lock.json') }}

      # The guest kernel reads zstd erofs; Ubuntu's erofs-utils has no zstd.
      - name: Build mkfs.erofs with zstd
        if: steps.vm-assets.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y -q libzstd-dev uuid-dev autoconf automake libtool pkg-config
          curl -fsSLo /tmp/erofs-utils.tar.gz https://git.kernel.org/pub/scm/linux/kernel/git/xiang/erofs-utils.git/snapshot/erofs-utils-1.8.10.tar.gz
          echo "05eb4edebe11decce6ecb34e98d2f80c8cd283c2f2967d8ba7efd58418570514  /tmp/erofs-utils.tar.gz" | sha256sum -c
          tar -C /tmp -xzf /tmp/erofs-utils.tar.gz && cd /tmp/erofs-utils-1.8.10
          ./autogen.sh && ./configure -q --with-libzstd --disable-fuse && make -s -j4 -C lib && make -s -C mkfs
          echo "MKFS_EROFS=$PWD/mkfs/mkfs.erofs" >> "$GITHUB_ENV"

      # The examples teach Python, so the published guest also has python3
      # (read on demand: no extra download at boot). Other tools install on first use.
      - name: Build VM assets (unkernel runtime, guest image, Monaco)
        if: steps.vm-assets.outputs.cache-hit != 'true'
        run: node dev/vm/build.mjs --packages python3

      - name: Prepare browser fixtures
        run: |
          sh dev/core-tests/sync.sh
          quarto render dev/core-tests/slides.qmd
          quarto render dev/core-tests/doc.qmd
          node dev/apps-mkslides.mjs
          dev/vm/node_modules/.bin/playwright install --with-deps chromium

      - name: Test real VM and applications
        run: |
          node dev/server.mjs . 8203 nocoi > /tmp/quarto-os-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node dev/window-layout.mjs --port 8203
          node dev/vm-test.mjs --port 8203
          node dev/apps-e2e.mjs --port 8203 --real

      - name: Render site
        run: quarto render

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
