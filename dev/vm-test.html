<!doctype html>
<meta charset="utf-8">
<title>VM test</title>
<pre id="log"></pre>
<script type="module">
// Boots the real VM for dev/vm-test.mjs: ?persist&cache=ID&setup=SCRIPT&network=1
import { createVM } from '../_extensions/quarto-os/vm/vm.js';
const q = new URLSearchParams(location.search);
const t0 = performance.now();
window.statuses = [];
window.vm = await createVM({
  assetBase: '/vm-assets/', persist: q.has('persist'), cacheId: q.get('cache') || undefined,
  setup: q.get('setup') || '', network: q.get('network') === '1',
});
vm.on('status', (m) => { statuses.push(m); document.getElementById('log').textContent += m + '\n'; });
window.booted = vm.ready.then(() => performance.now() - t0, (e) => { throw String(e); });
</script>
